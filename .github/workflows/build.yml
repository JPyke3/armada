---
name: Build images
on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  boot-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/boot-tests.yml

  packages:
    name: Packages
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/packages.yml
    secrets: inherit

  build_push:
    name: Handheld container
    needs: [packages, boot-tests]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-container.yml
    with:
      variant: handheld
      build_args: ${{ needs.packages.outputs.build_args }}
    secrets: inherit

  build_desktop:
    name: Desktop container
    needs: [packages, boot-tests]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-container.yml
    with:
      variant: desktop
      build_args: ${{ needs.packages.outputs.build_args }}
    secrets: inherit

  publish_disk:
    name: Disk images
    needs: [build_push, build_desktop]
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') &&
      needs.build_push.outputs.channel != '' &&
      github.event.repository.fork == false
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-disk.yml
    with:
      tag: ${{ needs.build_push.outputs.tag }}
      channel: ${{ needs.build_push.outputs.channel }}
      publish_r2: true
      tests_passed: true
      desktop_image_digest: ${{ needs.build_desktop.outputs.digest }}
      image_digest: ${{ needs.build_push.outputs.digest }}
      source_ref: ${{ needs.build_push.outputs.revision }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
