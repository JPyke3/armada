---
name: Build disk images

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tests_passed:
        type: boolean
        default: false
      desktop_image_digest:
        type: string
        default: ""
      tag:
        type: string
        default: ""
      channel:
        type: string
        default: preview
      publish_r2:
        type: boolean
        default: false
      image_digest:
        type: string
        default: ""
      source_ref:
        type: string
        default: ""
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  R2_PREFIX: ${{ inputs.channel || 'preview' }}
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

concurrency:
  group: ${{ inputs.publish_r2 && format('{0}-disk', inputs.channel) || format('build-disk-{0}', github.ref || github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  boot-tests:
    if: ${{ !inputs.tests_passed }}
    permissions:
      contents: read
    uses: ./.github/workflows/boot-tests.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}

  prepare:
    name: Prepare disk build
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digests: ${{ steps.source.outputs.digests }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Check R2 configuration
        if: inputs.publish_r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for setting in R2_ENDPOINT_URL R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::${setting} is not configured. Set it in repository Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Install container tools
        run: |
          set -euxo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update; sudo apt-get install -y skopeo; }

      - name: Resolve container tag
        id: tag
        env:
          BUILD_REF: ${{ github.ref }}
          SELECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${SELECTED_TAG}"
          if [ -z "${tag}" ]; then
            if [[ "${BUILD_REF}" != refs/heads/* ]]; then
              echo "::error::Select a branch to build."
              exit 1
            fi
            branch="${BUILD_REF#refs/heads/}"
            case "${branch}" in
              main) tag=testing ;;
              staging) tag=staging ;;
              testing|preview|beta|stable|latest)
                echo "::error::Reserved release channel. Build main/staging or use Promote channel."
                exit 1 ;;
              *) tag="${branch}" ;;
            esac
          fi
          if ! [[ "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Branch or explicit tag cannot be used as a container tag."
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve container source
        id: source
        env:
          CONTAINER_TAG: ${{ steps.tag.outputs.tag }}
          EXPECTED_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_DESKTOP_DIGEST: ${{ inputs.desktop_image_digest }}
          EXPECTED_REVISION: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          digests='{}'
          for variant in handheld desktop; do
            suffix=""; expected="${EXPECTED_DIGEST}"
            if [ "${variant}" = desktop ]; then
              suffix=-desktop; expected="${EXPECTED_DESKTOP_DIGEST}"
            fi
            image="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}${suffix}:${CONTAINER_TAG}"
            inspection=$(skopeo inspect --no-creds --override-arch arm64 "docker://${image}")
            digest=$(jq -er '.Digest' <<< "${inspection}")
            revision=$(jq -er '.Labels["org.opencontainers.image.revision"]' <<< "${inspection}")
            if ! [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ && "${revision}" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::${variant} container has an invalid digest or source revision."
              exit 1
            fi
            if [ -n "${expected}" ] && [ "${digest}" != "${expected}" ]; then
              echo "::error::${variant} container digest does not match requested digest ${expected}."
              exit 1
            fi
            if [ "${revision}" != "${EXPECTED_REVISION}" ]; then
              echo "::error::${variant} container revision ${revision} does not match source revision ${EXPECTED_REVISION}."
              exit 1
            fi
            digests=$(jq -c --arg variant "${variant}" --arg digest "${digest}" \
              '. + {($variant): $digest}' <<< "${digests}")
          done
          echo "digests=${digests}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.variant }} disk image
    needs: [prepare, boot-tests]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.boot-tests.result == 'success' || needs.boot-tests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        variant: [handheld, desktop]
    env:
      IMAGE_NAME: ${{ github.event.repository.name }}${{ matrix.variant == 'desktop' && '-desktop' || '' }}
      DISK_ARTIFACT: armada-disk-image-${{ matrix.variant }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Free build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euxo pipefail
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends containernetworking-plugins device-tree-compiler

      - name: Install just
        uses: ublue-os/just-action@30ab4659369934b65b655bf8d2fa4ddd6547d384 # v3

      - name: Build disk image
        env:
          ARMADA_IMAGE_DIGEST: ${{ fromJSON(needs.prepare.outputs.digests)[matrix.variant] }}
        run: |
          set -euxo pipefail
          JUST_BIN=$(command -v just)
          sudo git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          # Build the disk FROM the published container so the disk and the ghcr
          # image are identical content and the installed system's bootc origin
          # points at ghcr (so OTA works). The Justfile pulls the ref for BIB.
          sudo env PATH="${PATH}" ARMADA_IMAGE_DIGEST="${ARMADA_IMAGE_DIGEST}" \
            "${JUST_BIN}" build-armada-image "${IMAGE_REGISTRY}/${IMAGE_NAME}" \
            "${{ needs.prepare.outputs.tag }}"
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Prepare disk image upload
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(output/armada-*.img.gz)
          if [ "${#images[@]}" -ne 1 ] || [ ! -s "${images[0]}" ]; then
            echo "::error::Expected exactly one nonempty disk image in output/."
            exit 1
          fi
          filename="${images[0]##*/}"
          (cd output && sha256sum "${filename}" > "${filename}.sha256")
          echo "\`${filename}\` ($(du -h "${images[0]}" | cut -f1))" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DISK_ARTIFACT }}
          path: |
            output/armada-*.img.gz
            output/armada-*.img.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    name: Publish disk images
    needs: [prepare, build]
    if: inputs.publish_r2
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Download disk images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          for variant in handheld desktop; do
            gh run download "${GITHUB_RUN_ID}" --name "armada-disk-image-${variant}" \
              --dir "disks/${variant}/output"
          done

      - name: Publish disk images to R2
        id: publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CONTAINER_TAG: ${{ needs.prepare.outputs.tag }}
          CONTAINER_DIGESTS: ${{ needs.prepare.outputs.digests }}
          BUILD_COMMIT: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          for variant in handheld desktop; do
            (
              cd "disks/${variant}"
              export CONTAINER_DIGEST
              CONTAINER_DIGEST=$(jq -er --arg variant "${variant}" '.[$variant]' <<< "${CONTAINER_DIGESTS}")
              if [ "${variant}" = desktop ]; then
                export IMAGE_NAME="${IMAGE_NAME}-desktop" R2_PREFIX="desktop-${R2_PREFIX}"
              fi
              export ARMADA_SOURCE_ROOT="${GITHUB_WORKSPACE}"
              bash "${GITHUB_WORKSPACE}/.github/scripts/publish-disk.sh"
            )
          done
